name: Validate Infrastructure

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        working-directory: mediastack
        run: docker compose config --quiet

      - name: Validate with Proxmox LXC override
        working-directory: mediastack
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: Validate Caddyfile
        working-directory: mediastack
        run: |
          docker run --rm \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:latest caddy validate --config /etc/caddy/Caddyfile

      - name: Run tests
        working-directory: mediastack
        run: bash tests/run_all.sh
